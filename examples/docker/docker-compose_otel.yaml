# docker-compose_otel.yaml — TeaStore (SUT2) with OpenTelemetry + Jaeger
# REVISED 2026-09-11 after first-attempt failures. Changes from v1:
#   - Jaeger: in-memory storage, NOT Badger. Since Jaeger 1.50 the all-in-one
#     image runs as non-root and can't write the Badger volume (crashed with
#     Exited 1). In-memory is fine for SUT2: pilots are short (minutes) and
#     exported immediately, so "data lost on restart" is a non-issue. Removes
#     the permissions failure entirely.
#   - OTel agent: MOUNTED FROM THE HOST, not downloaded by an init container.
#     The init container failed (curl error 23 — couldn't write its volume) and
#     its non-zero exit blocked every dependent service. Download the jar once
#     on the host and mount it read-only. More reliable and reproducible.
#   - depends_on: condition form so services wait for jaeger to be RUNNING.
#
# PREREQUISITE (once, on the host, in examples/docker/ next to this file):
#   Invoke-WebRequest -Uri https://github.com/open-telemetry/opentelemetry-java-instrumentation/releases/download/v2.9.0/opentelemetry-javaagent.jar -OutFile opentelemetry-javaagent.jar
#   (If it fails to attach on Java 8, use the v1.32.1 jar instead, same name.)
#
# RUN:
#   docker compose -f docker-compose_otel.yaml up -d
#   # Jaeger UI: http://localhost:16686
#   # App: http://localhost:8080/tools.descartes.teastore.webui/

services:

  jaeger:
    image: jaegertracing/all-in-one:1.57
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE: "memory"
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

  registry:
    image: descartesresearch/teastore-registry
    expose:
      - "8080"

  db:
    image: descartesresearch/teastore-db
    expose:
      - "3306"
    ports:
      - "3306:3306"

  persistence:
    image: descartesresearch/teastore-persistence
    expose:
      - "8080"
    depends_on:
      jaeger: {condition: service_started}
      registry: {condition: service_started}
      db: {condition: service_started}
    volumes:
      - ./opentelemetry-javaagent.jar:/otel/opentelemetry-javaagent.jar:ro
      - ./aspectjweaver.jar:/otel/aspectjweaver.jar:ro
      - ./empty-aop.xml:/usr/local/tomcat/lib/aop.xml:ro
    environment:
      HOST_NAME: "persistence"
      REGISTRY_HOST: "registry"
      DB_HOST: "db"
      DB_PORT: "3306"
      JAVA_TOOL_OPTIONS: "-javaagent:/otel/opentelemetry-javaagent.jar -javaagent:/otel/aspectjweaver.jar"
      OTEL_SERVICE_NAME: "persistence"
      OTEL_TRACES_EXPORTER: "otlp"
      OTEL_METRICS_EXPORTER: "none"
      OTEL_LOGS_EXPORTER: "none"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4317"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_PROPAGATORS: "tracecontext,baggage"
    ports:
      - "8081:8080"

  auth:
    image: descartesresearch/teastore-auth
    expose:
      - "8080"
    depends_on:
      jaeger: {condition: service_started}
      registry: {condition: service_started}
    volumes:
      - ./opentelemetry-javaagent.jar:/otel/opentelemetry-javaagent.jar:ro
      - ./aspectjweaver.jar:/otel/aspectjweaver.jar:ro
      - ./empty-aop.xml:/usr/local/tomcat/lib/aop.xml:ro
    environment:
      HOST_NAME: "auth"
      REGISTRY_HOST: "registry"
      JAVA_TOOL_OPTIONS: "-javaagent:/otel/opentelemetry-javaagent.jar -javaagent:/otel/aspectjweaver.jar"
      OTEL_SERVICE_NAME: "auth"
      OTEL_TRACES_EXPORTER: "otlp"
      OTEL_METRICS_EXPORTER: "none"
      OTEL_LOGS_EXPORTER: "none"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4317"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_PROPAGATORS: "tracecontext,baggage"

  image:
    image: descartesresearch/teastore-image
    expose:
      - "8080"
    depends_on:
      jaeger: {condition: service_started}
      registry: {condition: service_started}
    volumes:
      - ./opentelemetry-javaagent.jar:/otel/opentelemetry-javaagent.jar:ro
      - ./aspectjweaver.jar:/otel/aspectjweaver.jar:ro
      - ./empty-aop.xml:/usr/local/tomcat/lib/aop.xml:ro
    environment:
      HOST_NAME: "image"
      REGISTRY_HOST: "registry"
      JAVA_TOOL_OPTIONS: "-javaagent:/otel/opentelemetry-javaagent.jar -javaagent:/otel/aspectjweaver.jar"
      OTEL_SERVICE_NAME: "image"
      OTEL_TRACES_EXPORTER: "otlp"
      OTEL_METRICS_EXPORTER: "none"
      OTEL_LOGS_EXPORTER: "none"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4317"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_PROPAGATORS: "tracecontext,baggage"
    ports:
      - "8082:8080"

  recommender:
    image: descartesresearch/teastore-recommender
    expose:
      - "8080"
    depends_on:
      jaeger: {condition: service_started}
      registry: {condition: service_started}
    volumes:
      - ./opentelemetry-javaagent.jar:/otel/opentelemetry-javaagent.jar:ro
      - ./aspectjweaver.jar:/otel/aspectjweaver.jar:ro
      - ./empty-aop.xml:/usr/local/tomcat/lib/aop.xml:ro
    environment:
      HOST_NAME: "recommender"
      REGISTRY_HOST: "registry"
      JAVA_TOOL_OPTIONS: "-javaagent:/otel/opentelemetry-javaagent.jar -javaagent:/otel/aspectjweaver.jar"
      OTEL_SERVICE_NAME: "recommender"
      OTEL_TRACES_EXPORTER: "otlp"
      OTEL_METRICS_EXPORTER: "none"
      OTEL_LOGS_EXPORTER: "none"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4317"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_PROPAGATORS: "tracecontext,baggage"

  webui:
    image: descartesresearch/teastore-webui
    expose:
      - "8080"
    depends_on:
      jaeger: {condition: service_started}
      registry: {condition: service_started}
    volumes:
      - ./opentelemetry-javaagent.jar:/otel/opentelemetry-javaagent.jar:ro
      - ./aspectjweaver.jar:/otel/aspectjweaver.jar:ro
      - ./empty-aop.xml:/usr/local/tomcat/lib/aop.xml:ro
    environment:
      HOST_NAME: "webui"
      REGISTRY_HOST: "registry"
      JAVA_TOOL_OPTIONS: "-javaagent:/otel/opentelemetry-javaagent.jar -javaagent:/otel/aspectjweaver.jar"
      OTEL_SERVICE_NAME: "webui"
      OTEL_TRACES_EXPORTER: "otlp"
      OTEL_METRICS_EXPORTER: "none"
      OTEL_LOGS_EXPORTER: "none"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4317"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_PROPAGATORS: "tracecontext,baggage"
    ports:
      - "8080:8080"